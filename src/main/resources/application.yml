server:
  port: ${PORT:8081}

spring:
  application:
    name: demo

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:nguyenvy16}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-256-bits-for-hs256}
  access-token-expiration: 900000 # 15 phút (ms)
  refresh-token-expiration: 604800000 # 7 ngày (ms)

momo:
  # Sandbox by default; production keys only ever come from environment variables.
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn}
  partner-code: ${MOMO_PARTNER_CODE:}
  access-key: ${MOMO_ACCESS_KEY:}
  secret-key: ${MOMO_SECRET_KEY:}
  ipn-url: ${MOMO_IPN_URL:}
  redirect-url: ${MOMO_REDIRECT_URL:}
  lang: vi

vestra:
  payments:
    momo-expiry: ${VESTRA_MOMO_EXPIRY:15m}
  kafka:
    # Off on Railway by default: the outbox is still written, nothing is published.
    enabled: ${VESTRA_KAFKA_ENABLED:false}
    topic: vestra.payments
    relay-interval: 1s
    relay-batch-size: 50
